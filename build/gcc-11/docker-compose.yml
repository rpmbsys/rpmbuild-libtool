version: "3"
services:
  rocky8build:
    build:
      context: .
      args:
        os: $RL8
    image: "aursu/rpmbuild:${RL8TAG}-build-gcc11"
  rocky8buildroot:
    build:
      context: .
      args:
        os: $RL8
        image: rpmb-root
    image: "aursu/rpmbuild:${RL8TAG}-build-gcc11-root"